      const val = Math.max(0, Math.min(500, Math.round(aqi)));
      return CPCB_BANDS.find(b => val >= b.min && val <= b.max) || CPCB_BANDS[CPCB_BANDS.length - 1];
    }

    function calcCigarettesPerDay(pm25) {
      return (pm25 / 22).toFixed(1);
    }

    function getGrapStage(aqi, isNCR) {
      if (!isNCR) return null;
      if (aqi > 450) return { stage: 'GRAP Stage-IV (Severe+)', color: 'bg-red-950 text-red-100 border-red-800', summary: 'Ban on non-essential trucks, construction halt, and hybrid/online school directives active in NCR.' };
      if (aqi > 400) return { stage: 'GRAP Stage-III (Severe)', color: 'bg-red-900 text-white border-red-700', summary: 'Strict ban on non-essential C&D activities, BS-III petrol / BS-IV diesel LMV restrictions.' };
      if (aqi > 300) return { stage: 'GRAP Stage-II (Very Poor)', color: 'bg-rose-700 text-white border-rose-800', summary: 'Diesel generator restrictions, mechanized road sweeping, and enhanced parking fees to curb private cars.' };
      if (aqi > 200) return { stage: 'GRAP Stage-I (Poor)', color: 'bg-orange-600 text-white border-orange-700', summary: 'Dust mitigation at construction sites, anti-smog guns, and strict PUC enforcement active.' };
      return { stage: 'GRAP Pre-Stage (Normal)', color: 'bg-emerald-700 text-white border-emerald-800', summary: 'Standard CPCB dust & vehicular emission norms active.' };
    }

    function buildDiurnalCurve(baseAqi) {
      const hourlyFactors = [
        1.12, 1.15, 1.17, 1.18, 1.16, 1.14,
        1.18, 1.24, 1.22, 1.12, 0.98, 0.84,
        0.74, 0.68, 0.66, 0.70, 0.78, 0.88,
        0.98, 1.08, 1.15, 1.19, 1.17, 1.14
      ];
      return hourlyFactors.map((mult, hour) => {
        const val = Math.max(18, Math.min(500, Math.round(baseAqi * mult)));
        const label = hour === 0 ? '12 AM' : hour < 12 ? `${hour} AM` : hour === 12 ? '12 PM' : `${hour - 12} PM`;
        return { hour, label, aqi: val, isAfternoonWindow: hour >= 12 && hour <= 16 };
      });
    }

    // =========================================================================
    // 3. SUB-COMPONENTS
    // =========================================================================
    function RadialAqiGauge({ aqi, band }) {
      const radius = 88;
      const circumference = Math.PI * radius;
      const clamped = Math.max(0, Math.min(500, aqi));
      const strokeDashoffset = circumference * (1 - clamped / 500);

      return (
        <div className="relative flex flex-col items-center justify-center my-2">
          <div className="relative w-56 h-32 flex items-end justify-center">
            <svg className="w-56 h-32 overflow-visible" viewBox="0 0 220 124">
              <path d="M 22 112 A 88 88 0 0 1 198 112" fill="none" stroke="#E2E8F0" strokeWidth="16" strokeLinecap="round" />
              <path
                d="M 22 112 A 88 88 0 0 1 198 112"
                fill="none"
                stroke={band.color}
                strokeWidth="16"
                strokeLinecap="round"
                strokeDasharray={circumference}
                strokeDashoffset={strokeDashoffset}
                style={{ transition: 'stroke-dashoffset 0.85s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.4s ease' }}
              />
            </svg>
            <div className="absolute bottom-0 flex flex-col items-center text-center">
              <span className="text-[10px] font-bold uppercase tracking-widest text-slate-400">CPCB NAQI</span>
              <span className="text-4xl sm:text-5xl font-extrabold font-mono tracking-tight text-slate-900 leading-none my-0.5">{aqi}</span>
              <span className="text-[11px] font-medium text-slate-500">0 – 500 Scale</span>
            </div>
          </div>

          <div className="w-full max-w-[240px] mt-3">
            <div className="grid grid-cols-6 gap-1 h-1.5 rounded-full overflow-hidden">
              {CPCB_BANDS.map(b => (
                <div key={b.label} style={{ backgroundColor: b.color }} title={`${b.label} (${b.min}–${b.max})`} />
              ))}
            </div>
            <div className="flex justify-between text-[10px] font-mono text-slate-400 mt-1">
              <span>0</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span>
            </div>
          </div>
        </div>
      );
    }

    function DiurnalForecastChart({ hourlyData, currentHour }) {
      const [hoveredHour, setHoveredHour] = useState(null);
      const maxVal = Math.max(200, ...hourlyData.map(d => d.aqi));
      const activePoint = hoveredHour !== null ? hourlyData[hoveredHour] : hourlyData[currentHour] || hourlyData[13];
      const activeBand = getCpcbBand(activePoint.aqi);

      return (
        <div className="flex flex-col h-full justify-between">
          <div className="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 mb-3">
            <div>
              <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                {hoveredHour !== null ? 'Selected Forecast Hour' : 'Current Boundary Layer'}
              </div>
              <div className="flex items-center gap-2 mt-0.5">
                <span className="text-sm font-bold font-mono text-slate-900">{activePoint.label}</span>
                <span className="text-xs font-semibold px-2 py-0.5 rounded-full text-white" style={{ backgroundColor: activeBand.color }}>
                  AQI {activePoint.aqi} • {activeBand.label}
                </span>
              </div>
            </div>
            <div className="text-right">
              {activePoint.isAfternoonWindow ? (
                <span className="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-lg">
                  <Icons.Sun className="w-3.5 h-3.5 text-amber-500" /> Best Ventilation Window
                </span>
              ) : (
                <span className="inline-flex items-center gap-1 text-[11px] font-semibold text-slate-600 bg-white border border-slate-200 px-2 py-1 rounded-lg">
                  <Icons.Moon className="w-3.5 h-3.5 text-indigo-500" /> Inversion Trapping
                </span>
              )}
            </div>
          </div>

          <div className="relative pt-4 pb-1">
            <div
              className="absolute top-0 bottom-5 bg-emerald-500/10 border-x border-dashed border-emerald-400/60 rounded-md pointer-events-none flex flex-col items-center justify-start pt-1"
              style={{ left: '50%', width: '20.8%' }}
            >
              <span className="text-[9px] font-bold uppercase tracking-tighter text-emerald-700 bg-white/90 px-1 rounded">
                Dispersion
              </span>
            </div>

            <div className="grid gap-1 items-end h-36 relative z-10" style={{ gridTemplateColumns: 'repeat(24, minmax(0, 1fr))' }}>
              {hourlyData.map((d) => {
                const band = getCpcbBand(d.aqi);
                const heightPct = Math.max(12, Math.round((d.aqi / maxVal) * 100));
                const isSelected = activePoint.hour === d.hour;
                const isNow = d.hour === currentHour;

                return (
                  <button
                    key={d.hour}
                    type="button"
                    onMouseEnter={() => setHoveredHour(d.hour)}
                    onMouseLeave={() => setHoveredHour(null)}
                    onClick={() => setHoveredHour(d.hour)}
                    className="group relative flex flex-col items-center justify-end h-full focus:outline-none"
                    aria-label={`${d.label}: AQI ${d.aqi}`}
                  >
                    {isNow && <span className="absolute -top-3.5 text-[9px] font-extrabold text-teal-700">NOW</span>}
                    <div
                      className={`w-full rounded-t-sm transition-all duration-200 ${isSelected ? 'ring-2 ring-slate-900 scale-x-110' : 'opacity-85 group-hover:opacity-100'}`}
                      style={{ height: `${heightPct}%`, backgroundColor: band.color }}
                    />
                  </button>
                );
              })}
            </div>

            <div className="flex justify-between text-[10px] font-mono text-slate-400 mt-1.5 px-0.5">
              <span>12 AM</span><span>6 AM</span><span className="text-emerald-700 font-semibold">12 PM</span><span>6 PM</span><span>11 PM</span>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 4. MAIN APPLICATION
    // =========================================================================
    function App() {
      const [cityId, setCityId] = useState('greater_noida');
      const [stationIndex, setStationIndex] = useState(0);
      const [customStationOverride, setCustomStationOverride] = useState(null);
      const [pinQuery, setPinQuery] = useState('');
      const [searchNotice, setSearchNotice] = useState('');

      const [mode, setMode] = useState('live');
      const [simAqi, setSimAqi] = useState(342);

      const [selectedPollutantKey, setSelectedPollutantKey] = useState('pm25');
      const [activeTab, setActiveTab] = useState('planner');
      const [persona, setPersona] = useState('general');
      const [selectedSourceIdx, setSelectedSourceIdx] = useState(0);

      const [commuteMinutes, setCommuteMinutes] = useState(60);
      const [transportMode, setTransportMode] = useState('open');
      const [maskType, setMaskType] = useState('none');
      const [sortAsc, setSortAsc] = useState(true);

      const [nowString, setNowString] = useState('');
      const [currentHour, setCurrentHour] = useState(new Date().getHours());

      // Optional User-Provided Gemini API Key for GitHub Pages / Local Hosting
      const [userApiKey, setUserApiKey] = useState('');
      const [showKeyInput, setShowKeyInput] = useState(false);

      const [chatHistory, setChatHistory] = useState([
        {
          role: 'model',
          text: 'Namaste! I am **VayuMitra**, your CPCB-grounded Air Quality Copilot. Ask me about outdoor running windows, N95/HEPA settings, GRAP rules, or inter-city comparisons.'
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [isChatLoading, setIsChatLoading] = useState(false);
      const chatScrollRef = useRef(null);

      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setCurrentHour(now.getHours());
          setNowString(
            now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }) + ' IST'
          );
        };
        updateClock();
        const timer = setInterval(updateClock, 30000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (chatScrollRef.current) {
          chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
        }
      }, [chatHistory, isChatLoading]);

      const activeTelemetry = useMemo(() => {
        const city = CITIES_DB[cityId];
        const baseStation = city.stations[stationIndex] || city.stations[0];

        if (mode === 'simulated') {
          const ratio = simAqi / baseStation.aqi;
          const scaledPollutants = {};
          Object.entries(baseStation.pollutants).forEach(([k, v]) => {
            const scaled = v * ratio;
            scaledPollutants[k] = k === 'co' ? Number(scaled.toFixed(1)) : Math.max(1, Math.round(scaled));
          });
          return {
            city,
            stationName: `${baseStation.name} (Simulated)`,
            pin: customStationOverride?.pin || baseStation.pin,
            aqi: simAqi,
            pollutants: scaledPollutants,
            sources: baseStation.sources,
            mixingHeight: Math.max(220, Math.round(city.mixingHeight * (baseStation.aqi / Math.max(40, simAqi))))
          };
        }

        const offset = customStationOverride?.aqiOffset || 0;
        const effectiveAqi = Math.max(20, Math.min(495, baseStation.aqi + offset));
        const ratio = effectiveAqi / baseStation.aqi;
        const adjustedPollutants = {};
        Object.entries(baseStation.pollutants).forEach(([k, v]) => {
          const adj = v * ratio;
          adjustedPollutants[k] = k === 'co' ? Number(adj.toFixed(1)) : Math.max(1, Math.round(adj));
        });

        return {
          city,
          stationName: customStationOverride?.stationName || baseStation.name,
          pin: customStationOverride?.pin || baseStation.pin,
          aqi: effectiveAqi,
          pollutants: adjustedPollutants,
          sources: baseStation.sources,
          mixingHeight: city.mixingHeight
        };
      }, [cityId, stationIndex, customStationOverride, mode, simAqi]);

      const activeBand = useMemo(() => getCpcbBand(activeTelemetry.aqi), [activeTelemetry.aqi]);

      const dominantPollutant = useMemo(() => {
        let maxRatio = -1;
        let domKey = 'pm25';
        Object.entries(activeTelemetry.pollutants).forEach(([k, val]) => {
          const ratio = val / POLLUTANT_SPECS[k].limit;
          if (ratio > maxRatio) {
            maxRatio = ratio;
            domKey = k;
          }
        });
        return {
          ...POLLUTANT_SPECS[domKey],
          value: activeTelemetry.pollutants[domKey],
          multiple: (activeTelemetry.pollutants[domKey] / POLLUTANT_SPECS[domKey].limit).toFixed(1)
        };
      }, [activeTelemetry.pollutants]);

      const grapAlert = useMemo(() => getGrapStage(activeTelemetry.aqi, activeTelemetry.city.isNCR), [activeTelemetry.aqi, activeTelemetry.city.isNCR]);
      const hourlyForecast = useMemo(() => buildDiurnalCurve(activeTelemetry.aqi), [activeTelemetry.aqi]);
      const cigarettesEq = useMemo(() => calcCigarettesPerDay(activeTelemetry.pollutants.pm25), [activeTelemetry.pollutants.pm25]);

      const doseMetrics = useMemo(() => {
        const pm25 = activeTelemetry.pollutants.pm25;
        const modeFactors = {
          ac: { ventilation: 0.012, infiltration: 0.45 },
          open: { ventilation: 0.016, infiltration: 1.15 },
          active: { ventilation: 0.045, infiltration: 1.0 }
        };
        const maskFiltration = { none: 1.0, surgical: 0.72, n95: 0.12 };
        const mf = modeFactors[transportMode];
        const hours = commuteMinutes / 60;
        const rawInhaledUg = pm25 * mf.infiltration * mf.ventilation * 60 * hours * maskFiltration[maskType];
        const n95InhaledUg = pm25 * mf.infiltration * mf.ventilation * 60 * hours * 0.12;
        const safeDailyBudgetUg = 25 * 0.014 * 60 * 24;

        return {
          inhaledUg: Math.round(rawInhaledUg),
          n95InhaledUg: Math.round(n95InhaledUg),
          savedWithN95: Math.max(0, Math.round(rawInhaledUg - n95InhaledUg)),
          budgetPct: Math.min(250, Math.round((rawInhaledUg / safeDailyBudgetUg) * 100))
        };
      }, [activeTelemetry.pollutants.pm25, commuteMinutes, transportMode, maskType]);

      const allStationsList = useMemo(() => {
        const list = [];
        Object.values(CITIES_DB).forEach(c => {
          c.stations.forEach(s => {
            list.push({
              cityId: c.id, cityName: c.name, region: c.region,
              stationName: s.name, pin: s.pin, aqi: s.aqi,
              pm25: s.pollutants.pm25, band: getCpcbBand(s.aqi)
            });
          });
        });
        return list.sort((a, b) => (sortAsc ? a.aqi - b.aqi : b.aqi - a.aqi));
      }, [sortAsc]);

      const handleCitySelect = (newCityId) => {
        setCityId(newCityId);
        setStationIndex(0);
        setCustomStationOverride(null);
        setSelectedSourceIdx(0);
        setSearchNotice('');
        if (mode === 'simulated') setSimAqi(CITIES_DB[newCityId].stations[0].aqi);
      };

      const handlePinSearch = (e) => {
        e.preventDefault();
        const q = pinQuery.trim().toLowerCase();
        if (!q) return;

        for (const city of Object.values(CITIES_DB)) {
          for (let idx = 0; idx < city.stations.length; idx++) {
            const st = city.stations[idx];
            if (st.pin === q || st.name.toLowerCase().includes(q) || city.name.toLowerCase() === q) {
              setCityId(city.id);
              setStationIndex(idx);
              setCustomStationOverride(null);
              setMode('live');
              setSearchNotice(`Locked onto CPCB station: ${st.name} (PIN ${st.pin})`);
              return;
            }
          }
        }

        if (/^\d{6}$/.test(q)) {
          let targetCityId = 'greater_noida';
          if (q.startsWith('201')) targetCityId = 'greater_noida';
          else if (q.startsWith('110')) targetCityId = 'delhi';
          else if (q.startsWith('400')) targetCityId = 'mumbai';
          else if (q.startsWith('560')) targetCityId = 'bengaluru';
          else if (q.startsWith('411')) targetCityId = 'pune';
          else if (q.startsWith('500')) targetCityId = 'hyderabad';
          else if (q.startsWith('700')) targetCityId = 'kolkata';
          else if (q.startsWith('600')) targetCityId = 'chennai';

          const offset = (parseInt(q.slice(-2), 10) % 28) - 14;
          setCityId(targetCityId);
          setStationIndex(0);
          setCustomStationOverride({
            stationName: `Nearest CAAQMS Node — ${CITIES_DB[targetCityId].name}`,
            pin: q,
            aqiOffset: offset
          });
          setMode('live');
          setSearchNotice(`Interpolated hyperlocal telemetry for PIN ${q} via ${CITIES_DB[targetCityId].name} grid.`);
          return;
        }

        setSearchNotice(`No exact match for "${pinQuery}". Try 201308 (Greater Noida), 110092 (Delhi), 400051 (Mumbai), or 560001 (Bengaluru).`);
      };

      // Gemini Copilot Handler with Grounded Offline Fallback
      const sendChatMessage = async (promptText) => {
        const query = (promptText || chatInput).trim();
        if (!query || isChatLoading) return;

        setChatInput('');
        const updatedHistory = [...chatHistory, { role: 'user', text: query }];
        setChatHistory(updatedHistory);
        setIsChatLoading(true);

        const metroComparison = Object.values(CITIES_DB)
          .map(c => `${c.name} (${c.stations[0].name}): AQI ${c.stations[0].aqi} (${getCpcbBand(c.stations[0].aqi).label}, PM2.5=${c.stations[0].pollutants.pm25} µg/m³)`)
          .join('; ');

        const systemInstruction = `You are VayuMitra, an Indian Urban Air Quality & Health Intelligence Copilot grounded in CPCB NAQI standards.
Active Station: ${activeTelemetry.stationName} (PIN ${activeTelemetry.pin}), City: ${activeTelemetry.city.name} (${activeTelemetry.city.region}).
Current CPCB AQI: ${activeTelemetry.aqi} (${activeBand.label}).
Dominant Pollutant: ${dominantPollutant.name} at ${dominantPollutant.value} ${dominantPollutant.unit} (${dominantPollutant.multiple}x safe limit).
All 6 Pollutants: PM2.5=${activeTelemetry.pollutants.pm25} µg/m³, PM10=${activeTelemetry.pollutants.pm10} µg/m³, NO2=${activeTelemetry.pollutants.no2} µg/m³, SO2=${activeTelemetry.pollutants.so2} µg/m³, CO=${activeTelemetry.pollutants.co} mg/m³, O3=${activeTelemetry.pollutants.o3} µg/m³.
Passive Cigarette Equivalence: ~${cigarettesEq} cigarettes/day.
GRAP Status: ${grapAlert ? grapAlert.stage + ' - ' + grapAlert.summary : 'Non-NCR city'}.
User Health Persona: ${persona}.
Other Metros: ${metroComparison}.
Keep responses concise, structured with bullet points, and under 140 words.`;

        let replyText = null;
        const activeKey = userApiKey.trim();

        if (activeKey) {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`;
          const payload = {
            contents: updatedHistory.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] })),
            systemInstruction: { parts: [{ text: systemInstruction }] }
          };

          for (let attempt = 0; attempt < 2; attempt++) {
            try {
              const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const data = await res.json();
              const candidateText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
              if (candidateText) {
                replyText = candidateText;
                break;
              }
            } catch (err) {
              await new Promise(r => setTimeout(r, 800));
            }
          }
        }

        // Grounded Smart Local Engine (works out-of-the-box on GitHub Pages without API key)
        if (!replyText) {
          await new Promise(r => setTimeout(r, 350));
          const qLower = query.toLowerCase();
          if (qLower.includes('run') || qLower.includes('jog') || qLower.includes('exercise')) {
            replyText = activeTelemetry.aqi > 150
              ? `**Hold off on outdoor running in ${activeTelemetry.city.name}.** At **AQI ${activeTelemetry.aqi} (${activeBand.label})**, deep aerobic breathing multiplies PM2.5 lung deposition (~${cigarettesEq} cigarettes/day equivalent). Shift your 5km session to an indoor treadmill.`
              : `**Conditions are favorable for a 5km run in ${activeTelemetry.city.name}!** Current AQI is **${activeTelemetry.aqi} (${activeBand.label})** with PM2.5 at ${activeTelemetry.pollutants.pm25} µg/m³. Prefer green parks away from arterial traffic.`;
          } else if (qLower.includes('hepa') || qLower.includes('purifier') || qLower.includes('indoor')) {
            replyText = `**HEPA Purifier Protocol for AQI ${activeTelemetry.aqi}:**\n• Run your **True HEPA H13** unit on **High/Turbo** for 30 mins with doors/windows sealed, then maintain **Auto/Medium**.\n• Target CADR ≥ 350 m³/hr for bedrooms.\n• Keep windows closed during **6–10 AM** and **7–11 PM** inversion peaks.`;
          } else if (qLower.includes('grap')) {
            replyText = grapAlert
              ? `**${grapAlert.stage}** is active for ${activeTelemetry.city.name} (AQI ${activeTelemetry.aqi}):\n• ${grapAlert.summary}\n• Wear certified N95 respirators outdoors and avoid open biomass burning.`
              : `**${activeTelemetry.city.name}** is outside the Delhi-NCR CAQM GRAP jurisdiction, operating under standard CPCB National Ambient Air Quality Standards (current AQI: **${activeTelemetry.aqi}**).`;
          } else if (qLower.includes('compare') || qLower.includes('bengaluru') || qLower.includes('mumbai')) {
            const blr = CITIES_DB.bengaluru.stations[0];
            replyText = `**${activeTelemetry.city.name} vs. Bengaluru Snapshot:**\n• **${activeTelemetry.city.name} (${activeTelemetry.stationName}):** AQI **${activeTelemetry.aqi}** (${activeBand.label}), PM2.5: ${activeTelemetry.pollutants.pm25} µg/m³.\n• **Bengaluru (${blr.name}):** AQI **${blr.aqi}** (${getCpcbBand(blr.aqi).label}), PM2.5: ${blr.pollutants.pm25} µg/m³.\nHigher boundary-layer mixing height (${CITIES_DB.bengaluru.mixingHeight}m vs ${activeTelemetry.mixingHeight}m) disperses particulates faster in Bengaluru.`;
          } else {
            replyText = `**${activeTelemetry.stationName}** reports **AQI ${activeTelemetry.aqi} (${activeBand.label})**, driven by **${dominantPollutant.name}** (${dominantPollutant.value} ${dominantPollutant.unit}, **${dominantPollutant.multiple}×** CPCB safe limit). ${activeBand.advisory}`;
          }
        }

        setChatHistory(prev => [...prev, { role: 'model', text: replyText }]);
        setIsChatLoading(false);
      };

      const personaAdvice = useMemo(() => {
        const aqi = activeTelemetry.aqi;
        const map = {
          general: {
            title: 'General Adult Commuter',
            mask: aqi > 200 ? 'Certified N95 / FFP2 Mask Outdoors' : aqi > 100 ? 'N95 Recommended in Heavy Traffic' : 'No Mask Needed',
            purifier: aqi > 200 ? 'HEPA H13 Continuous (Medium-High)' : aqi > 100 ? 'HEPA Auto Mode in Bedroom' : 'Natural Cross-Ventilation Safe',
            exercise: aqi > 250 ? 'Indoor Gym / Home Workout Only' : aqi > 120 ? 'Best Window: 12:30 PM – 4:00 PM' : 'Unrestricted Outdoor Activity',
            summary: aqi > 200
              ? `High particulate load (${activeTelemetry.pollutants.pm25} µg/m³ PM2.5). Use car cabin air recirculation on expressways and wear a snug N95 mask during two-wheeler or open commutes.`
              : `Manageable ambient conditions. Schedule prolonged outdoor errands during the afternoon solar dispersion window (12:30 PM – 4:00 PM).`
          },
          respiratory: {
            title: 'Asthma / COPD / Allergic Rhinitis',
            mask: aqi > 100 ? 'Mandatory Well-Fitted N95/N99' : 'Keep N95 Handy Near Traffic',
            purifier: aqi > 100 ? 'HEPA H13 24×7 + Saline Nasal Rinse' : 'HEPA Night Mode Recommended',
            exercise: aqi > 120 ? 'Strictly Indoors • Avoid Cold Morning Air' : 'Light Outdoor Walk (12 PM – 4 PM)',
            summary: `Elevated airway reactivity risk from ${dominantPollutant.name} (${dominantPollutant.multiple}× safe limit). Keep rescue bronchodilator inhaler accessible and avoid early morning cold inversion air.`
          },

                  </div>

                  {activeTab === 'planner' && (
                    <div className="space-y-4">
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        {[
                          { id: 'general', label: 'General Adult', sub: 'Daily commuter', emoji: '🧑🏽‍💼' },
                          { id: 'respiratory', label: 'Asthma / COPD', sub: 'Sensitive airways', emoji: '🫁' },
                          { id: 'vulnerable', label: 'Kids & Seniors', sub: '<12 or >65 yrs', emoji: '👵🏽' },
                          { id: 'athlete', label: 'Runner / Cyclist', sub: 'High ventilation', emoji: '🏃🏽‍♂️' }
                        ].map(p => (
                          <button
                            key={p.id}
                            type="button"
                            onClick={() => setPersona(p.id)}
                            className={`p-3 rounded-xl border text-left transition-all ${
                              persona === p.id
                                ? 'bg-teal-50/80 border-teal-500 ring-1 ring-teal-500'
                                : 'bg-white border-slate-200 hover:border-slate-300'
                            }`}
                          >
                            <div className="text-lg">{p.emoji}</div>
                            <div className="text-xs font-extrabold text-slate-900 mt-1">{p.label}</div>
                            <div className="text-[10px] text-slate-500">{p.sub}</div>
                          </button>
                        ))}
                      </div>

                      <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                        <div className="flex items-center justify-between">
                          <h4 className="text-sm font-extrabold text-slate-900">{personaAdvice.title} Protocol</h4>
                          <span className="text-[11px] font-mono font-bold px-2 py-0.5 rounded bg-white border border-slate-200 text-slate-700">
                            AQI {activeTelemetry.aqi}
                          </span>
                        </div>
                        <p className="text-xs text-slate-600 leading-relaxed">{personaAdvice.summary}</p>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
                          <div className="p-3 rounded-xl bg-white border border-slate-200/90">
                            <div className="text-[10px] font-bold uppercase tracking-wider text-teal-700">Respirator Gear</div>
                            <div className="text-xs font-bold text-slate-900 mt-1">{personaAdvice.mask}</div>
                          </div>
                          <div className="p-3 rounded-xl bg-white border border-slate-200/90">
                            <div className="text-[10px] font-bold uppercase tracking-wider text-indigo-700">Indoor Air &amp; HEPA</div>
                            <div className="text-xs font-bold text-slate-900 mt-1">{personaAdvice.purifier}</div>
                          </div>
                          <div className="p-3 rounded-xl bg-white border border-slate-200/90">
                            <div className="text-[10px] font-bold uppercase tracking-wider text-amber-700">Outdoor Window</div>
                            <div className="text-xs font-bold text-slate-900 mt-1">{personaAdvice.exercise}</div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'calculator' && (
                    <div className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                          <div className="flex justify-between text-xs font-bold text-slate-800 mb-2">
                            <span>Outdoor Duration</span>
                            <span className="font-mono text-teal-700">{commuteMinutes} mins</span>
                          </div>
                          <input
                            type="range"
                            min="15"
                            max="240"
                            step="15"
                            value={commuteMinutes}
                            onChange={(e) => setCommuteMinutes(Number(e.target.value))}
                            className="w-full accent-teal-600 cursor-pointer"
                          />
                          <div className="flex justify-between text-[10px] text-slate-400 mt-1">
                            <span>15m</span><span>2h</span><span>4h</span>
                          </div>
                        </div>

                        <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                          <div className="text-xs font-bold text-slate-800 mb-2">Commute Mode</div>
                          <div className="grid grid-cols-3 gap-1">
                            {[
                              { id: 'ac', label: 'AC Car', IconComp: Icons.Train },
                              { id: 'open', label: 'Bike/Auto', IconComp: Icons.Bike },
                              { id: 'active', label: 'Walk/Run', IconComp: Icons.Footprints }
                            ].map(m => {
                              const IC = m.IconComp;
                              return (
                                <button
                                  key={m.id}
                                  type="button"
                                  onClick={() => setTransportMode(m.id)}
                                  className={`py-1.5 px-1 rounded-lg text-[11px] font-bold border flex flex-col items-center gap-1 ${
                                    transportMode === m.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-700 border-slate-200'
                                  }`}
                                >
                                  <IC className="w-3.5 h-3.5" />
                                  <span>{m.label}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                          <div className="text-xs font-bold text-slate-800 mb-2">Mask Filtration</div>
                          <div className="grid grid-cols-3 gap-1">
                            {[
                              { id: 'none', label: 'None' },
                              { id: 'surgical', label: 'Cloth/Surg' },
                              { id: 'n95', label: 'N95 / FFP2' }
                            ].map(mk => (
                              <button
                                key={mk.id}
                                type="button"
                                onClick={() => setMaskType(mk.id)}
                                className={`py-2 px-1 rounded-lg text-[11px] font-bold border ${
                                  maskType === mk.id ? 'bg-teal-600 text-white border-teal-700' : 'bg-white text-slate-700 border-slate-200'
                                }`}
                              >
                                {mk.label}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>

                      <div className="p-4 rounded-xl bg-slate-900 text-white flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                            Estimated Commute Inhaled PM2.5 Dose
                          </div>
                          <div className="flex items-baseline gap-2 mt-1">
                            <span className="text-3xl font-extrabold font-mono text-amber-400">{doseMetrics.inhaledUg} µg</span>
                            <span className="text-xs text-slate-300">({doseMetrics.budgetPct}% of WHO 24-hr safe lung budget)</span>
                          </div>
                          <p className="text-xs text-slate-300 mt-1.5">
                            {maskType === 'n95'
                              ? 'Your N95 respirator is blocking ~88% of fine particulate lung deposition.'
                              : `Switching to a sealed N95 mask cuts this commute dose by ${doseMetrics.savedWithN95} µg (down to ${doseMetrics.n95InhaledUg} µg).`}
                          </p>
                        </div>
                        <div className="shrink-0 bg-white/10 border border-white/15 rounded-xl p-3 text-center">
                          <div className="text-[10px] uppercase tracking-wider text-teal-300 font-bold">With N95</div>
                          <div className="text-xl font-mono font-extrabold mt-0.5">{doseMetrics.n95InhaledUg} µg</div>
                          <div className="text-[10px] text-slate-300">-88% Dose</div>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'leaderboard' && (
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-semibold text-slate-500">Click any station row to load its live telemetry</span>
                        <button
                          type="button"
                          onClick={() => setSortAsc(!sortAsc)}
                          className="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-800 flex items-center gap-1"
                        >
                          <Icons.ArrowUpDown className="w-3.5 h-3.5" />
                          {sortAsc ? 'Cleanest First' : 'Highest Alert First'}
                        </button>
                      </div>

                      <div className="max-h-60 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100">
                        {allStationsList.map((item, idx) => (
                          <button
                            key={`${item.cityId}-${item.pin}`}
                            type="button"
                            onClick={() => {
                              const cityObj = CITIES_DB[item.cityId];
                              const stIdx = cityObj.stations.findIndex(s => s.pin === item.pin);
                              setCityId(item.cityId);
                              setStationIndex(stIdx >= 0 ? stIdx : 0);
                              setCustomStationOverride(null);
                              setMode('live');
                            }}
                            className="w-full px-3.5 py-2.5 hover:bg-slate-50 transition-colors flex items-center justify-between gap-2 text-left"
                          >
                            <div className="min-w-0">
                              <div className="flex items-center gap-2">
                                <span className="text-xs font-bold text-slate-900 truncate">{item.cityName}</span>
                                <span className="text-[11px] text-slate-500 truncate">• {item.stationName}</span>
                                {idx === 0 && sortAsc && (
                                  <span className="px-1.5 py-0.5 text-[9px] font-extrabold uppercase bg-emerald-100 text-emerald-800 rounded">
                                    Cleanest Escape
                                  </span>
                                )}
                                {idx === 0 && !sortAsc && (
                                  <span className="px-1.5 py-0.5 text-[9px] font-extrabold uppercase bg-rose-100 text-rose-800 rounded">
                                    Highest Alert
                                  </span>
                                )}
                              </div>
                              <div className="text-[10px] font-mono text-slate-400">PIN {item.pin} • PM2.5: {item.pm25} µg/m³</div>
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                              <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${item.band.badge}`}>
                                {item.aqi} • {item.band.label}
                              </span>
                              <Icons.ChevronRight className="w-3.5 h-3.5 text-slate-400" />
                            </div>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                  <span>Telemetry aligned with CPCB CAAQMS &amp; SAFAR-India protocols</span>
                  <span className="font-mono">Greater Noida • Delhi-NCR • All-India</span>
                </div>
              </section>

              {/* RIGHT 5 COLS: VAYUMITRA AI COPILOT */}
              <section className="lg:col-span-5 bg-white rounded-2xl border border-slate-200/90 shadow-xs flex flex-col h-[520px] lg:h-auto overflow-hidden">
                <div className="px-4 py-3 bg-gradient-to-r from-slate-900 via-slate-800 to-teal-950 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-xl bg-teal-500/20 border border-teal-400/30 flex items-center justify-center text-teal-300">
                      <Icons.Sparkles className="w-4 h-4" />
                    </div>
                    <div>
                      <div className="flex items-center gap-1.5">
                        <h3 className="text-sm font-extrabold">VayuMitra AI Copilot</h3>
                        <span className="px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-wider bg-teal-500/20 text-teal-300 rounded border border-teal-400/30">
                          CPCB Grounded
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-300 truncate max-w-[215px]">
                        Context: {activeTelemetry.city.name} • AQI {activeTelemetry.aqi}
                      </p>
                    </div>
                  </div>
                  <div className="flex items-center gap-1">
                    <button
                      type="button"
                      onClick={() => setShowKeyInput(!showKeyInput)}
                      title="Optional: Add Gemini API Key"
                      className={`p-1.5 rounded-lg transition-colors ${userApiKey ? 'text-emerald-300 bg-emerald-500/20' : 'text-slate-300 hover:text-white hover:bg-white/10'}`}
                    >
                      <Icons.Key className="w-3.5 h-3.5" />
                    </button>
                    <button
                      type="button"
                      onClick={() =>
                        setChatHistory([{
                          role: 'model',
                          text: `Context refreshed for **${activeTelemetry.stationName}** (AQI **${activeTelemetry.aqi}**). How can I help protect your respiratory health today?`
                        }])
                      }
                      title="Reset chat"
                      className="p-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-white/10 transition-colors"
                    >
                      <Icons.RefreshCw className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>

                {showKeyInput && (
                  <div className="px-3.5 py-2 bg-slate-800 text-white border-b border-slate-700 flex items-center gap-2 text-xs">
                    <input
                      type="password"
                      value={userApiKey}
                      onChange={(e) => setUserApiKey(e.target.value)}
                      placeholder="Optional Gemini API Key (for live LLM mode)..."
                      className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-2.5 py-1 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-teal-400"
                    />
                    <button
                      type="button"
                      onClick={() => setShowKeyInput(false)}
                      className="px-2.5 py-1 bg-teal-600 hover:bg-teal-500 rounded-lg font-bold text-[11px]"
                    >
                      Done
                    </button>
                  </div>
                )}

                <div ref={chatScrollRef} className="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50/70">
                  {chatHistory.map((msg, i) => {
                    const html = msg.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br />');
                    return (
                      <div key={i} className={`flex items-start gap-2 ${msg.role === 'user' ? 'justify-end' : ''}`}>
                        {msg.role !== 'user' && (
                          <div className="w-7 h-7 rounded-full bg-teal-600 text-white flex items-center justify-center text-[11px] font-extrabold shrink-0 mt-0.5">
                            VM
                          </div>
                        )}
                        <div
                          className={`rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed max-w-[86%] shadow-2xs ${
                            msg.role === 'user'
                              ? 'bg-teal-600 text-white rounded-tr-sm'
                              : 'bg-white border border-slate-200/90 text-slate-700 rounded-tl-sm'
                          }`}
                          dangerouslySetInnerHTML={{ __html: html }}
                        />
                      </div>
                    );
                  })}

                  {isChatLoading && (
                    <div className="flex items-start gap-2">
                      <div className="w-7 h-7 rounded-full bg-teal-600 text-white flex items-center justify-center text-[11px] font-extrabold shrink-0">
                        VM
                      </div>
                      <div className="bg-white border border-slate-200 rounded-2xl rounded-tl-sm px-3.5 py-2.5 text-xs text-slate-500 flex items-center gap-1.5">
                        <span className="w-1.5 h-1.5 rounded-full bg-teal-500 animate-bounce" />
                        <span className="w-1.5 h-1.5 rounded-full bg-teal-500 animate-bounce" style={{ animationDelay: '150ms' }} />
                        <span className="w-1.5 h-1.5 rounded-full bg-teal-500 animate-bounce" style={{ animationDelay: '300ms' }} />
                      </div>
                    </div>
                  )}
                </div>

                <div className="px-3 py-2 bg-white border-t border-slate-100 flex items-center gap-1.5 overflow-x-auto">
                  {[
                    'Should I go for a 5km run right now?',
                    'How to set my HEPA purifier for this AQI?',
                    'Compare Greater Noida vs Bengaluru today',
                    'Explain GRAP restrictions for this level'
                  ].map((chip) => (
                    <button
                      key={chip}
                      type="button"
                      onClick={() => sendChatMessage(chip)}
                      className="shrink-0 text-[11px] font-medium px-2.5 py-1 rounded-full bg-slate-100 hover:bg-teal-50 hover:text-teal-800 hover:border-teal-200 border border-slate-200 text-slate-700 transition-colors"
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    sendChatMessage();
                  }}
                  className="p-3 bg-white border-t border-slate-200 flex items-center gap-2"
                >
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Ask VayuMitra about AQI, masks, GRAP..."
                    className="flex-1 text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
                  />
                  <button
                    type="submit"
                    disabled={isChatLoading || !chatInput.trim()}
                    className="px-3.5 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 disabled:opacity-50 text-white text-xs sm:text-sm font-bold flex items-center gap-1.5 transition-colors"
                  >
                    <span>Ask</span>
                    <Icons.Send className="w-3.5 h-3.5" />
                  </button>
                </form>
              </section>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
